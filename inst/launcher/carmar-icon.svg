<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CarmaR app icon. The notebook's own steel blue (#4e79a7) deepened into
       a quiet gradient; a white R; the warm gold kernel-dot as its period —
       "R." — the statement mark. Drawn as paths where it matters (the dot),
       type where fonts are safe (rendered once, shipped as bitmaps). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#557fab"/>
      <stop offset="0.55" stop-color="#3d6491"/>
      <stop offset="1" stop-color="#26415e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="76" y="76" width="872" height="872" rx="196" fill="url(#bg)"/>
  <rect x="76" y="76" width="872" height="436" rx="196" fill="url(#sheen)"/>
  <text x="472" y="712" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="560" font-weight="700" fill="#ffffff">R</text>
  <circle cx="726" cy="686" r="58" fill="#e8d49a"/>
</svg>
